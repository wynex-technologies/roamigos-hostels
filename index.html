<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The phone's browser chrome - the strip the URL sits in - takes its
         colour from here. It used to be Adventure Red, which made the top of
         the screen a maroon band that nothing on the page continued. It is the
         header's own ground instead, so the bar appears to start at the very
         top of the device. `--header-ground` in src/index.css is the authority;
         the script below corrects this for dark before the first paint, and
         `ThemeProvider` re-reads it straight off the stylesheet after that. -->
    <meta name="theme-color" content="#e8ddcb" />
    <title>Roamigos Hostel - Stay. Explore. Connect.</title>

    <!-- Share card, canonical link and the site-wide schema. Generated from
         src/data/ by the `roamigos-seo` plugin in vite.config.ts and injected
         here, because the social crawlers that read them never run the app. -->
    <!--seo-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme.
      //
      // Light is the default and the OS preference does not get a vote: the
      // brand sheet is a light sheet - cream ground, maroon ink, mustard
      // accents - so a first-time visitor on a phone set to dark used to land
      // on the muted cut of a site built to be warm. Dark is still here and
      // still one tap away; it is now something the visitor asks for, and once
      // they do the choice is remembered and honoured on every later visit.
      (function () {
        try {
          var stored = localStorage.getItem('roamigos-theme')
          var dark = stored === 'dark'
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          // The stylesheet has not loaded yet, so these two cannot be read from
          // `--header-ground` the way ThemeProvider reads them. They are the
          // first frame only - keep them equal to the two values in index.css.
          var bar = document.querySelector('meta[name="theme-color"]')
          if (bar) bar.setAttribute('content', dark ? '#262626' : '#e8ddcb')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
